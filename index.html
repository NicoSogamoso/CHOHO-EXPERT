<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | CHOHO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --rojo: #E31C25;
      --rojo-osc: #B8141C;
      --negro: #111111;
      --gris-logo: #FFFFFF;
      --borde: #D9D9D9;
      --texto: #1A1A1A;
      --suave: #6B6B6B;
      --error: #B00020;
      --ok: #1E8E3E;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 32px 16px;
      color: var(--texto);
      background:
        linear-gradient(135deg, rgba(227,28,37,.10) 0 25%, transparent 25% 100%),
        var(--negro);
      min-height: 100vh;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .marca {
      background: var(--gris-logo);
      text-align: center;
      padding: 22px 16px 18px;
      border-bottom: 5px solid var(--rojo);
    }
    .marca img { width: 240px; max-width: 80%; height: auto; display: inline-block; }
    .cuerpo { padding: 26px 28px 30px; }
    h1 {
      font-size: 24px; margin: 0 0 4px; color: var(--negro);
      font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .5px;
    }
    h1 em { color: var(--rojo); font-style: italic; }
    .sub { margin: 0 0 24px; color: var(--suave); font-size: 13px; }
    .sub span { color: var(--rojo); font-weight: 700; }
    .campo { margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }
    label span { color: var(--rojo); }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--borde);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      color: var(--texto);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--rojo); box-shadow: 0 0 0 3px rgba(227,28,37,.18); }
    input.invalido, select.invalido { border-color: var(--error); background: #FFF7F7; }
    input.valido, select.valido { border-color: var(--ok); }
    .error { color: var(--error); font-size: 12px; font-weight: 600; margin-top: 4px; min-height: 14px; }
    .ayuda { color: var(--suave); font-size: 12px; margin-top: 4px; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--rojo);
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 0 var(--rojo-osc);
      transition: transform .08s, background .15s;
    }
    button:hover:not(:disabled) { background: var(--rojo-osc); }
    button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--rojo-osc); }
    button:disabled { background: #BDBDBD; box-shadow: 0 4px 0 #9E9E9E; cursor: not-allowed; }
    .mensaje { margin-top: 18px; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; display: none; white-space: pre-line; }
    .mensaje.ok { display: block; background: #E9F6EE; color: var(--ok); border-left: 4px solid var(--ok); }
    .mensaje.fallo { display: block; background: #FDECEC; color: var(--error); border-left: 4px solid var(--error); }
    .pie {
      background: var(--negro); color: #fff; text-align: center;
      font-size: 11px; font-weight: 800; font-style: italic; letter-spacing: 3px;
      text-transform: uppercase; padding: 10px;
    }
  </style>
</head>

    <div class="cuerpo">
    <h1>Formulario de <em>registro</em></h1>
    <p class="sub">Todos los campos marcados con <span>*</span> son obligatorios.</p>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="nombres">Nombres <span>*</span></label>
        <input type="text" id="nombres" name="nombres" autocomplete="given-name" maxlength="80">
        <div class="error" id="err-nombres"></div>
      </div>

      <div class="campo">
        <label for="apellidos">Apellidos <span>*</span></label>
        <input type="text" id="apellidos" name="apellidos" autocomplete="family-name" maxlength="80">
        <div class="error" id="err-apellidos"></div>
      </div>

      <div class="campo">
        <label for="tipoDocumento">Tipo de documento <span>*</span></label>
        <select id="tipoDocumento" name="tipoDocumento">
          <option value="Cédula de ciudadanía" selected>Cédula de ciudadanía</option>
        </select>
        <div class="error" id="err-tipoDocumento"></div>
      </div>

      <div class="campo">
        <label for="numeroDocumento">Número de documento <span>*</span></label>
        <input type="text" id="numeroDocumento" name="numeroDocumento" inputmode="numeric" maxlength="10" class="solo-numeros">
        <div class="ayuda">Solo números, sin puntos ni espacios.</div>
        <div class="error" id="err-numeroDocumento"></div>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico <span>*</span></label>
        <input type="email" id="correo" name="correo" autocomplete="email" maxlength="120">
        <div class="error" id="err-correo"></div>
      </div>

      <div class="campo">
        <label for="direccion">Dirección <span>*</span></label>
        <input type="text" id="direccion" name="direccion" autocomplete="street-address" maxlength="150">
        <div class="error" id="err-direccion"></div>
      </div>

      <div class="campo">
        <label for="billetera">Billetera <span>*</span></label>
        <select id="billetera" name="billetera">
          <option value="">Seleccione…</option>
          <option value="Nequi">Nequi</option>
          <option value="Daviplata">Daviplata</option>
        </select>
        <div class="error" id="err-billetera"></div>
      </div>

      <div class="campo">
        <label for="numeroBilletera">Número de billetera <span>*</span></label>
        <input type="text" id="numeroBilletera" name="numeroBilletera" inputmode="numeric" maxlength="10" class="solo-numeros">
        <div class="ayuda">Exactamente 10 números.</div>
        <div class="error" id="err-numeroBilletera"></div>
      </div>

      <div class="campo">
        <label for="celular">Celular de contacto <span>*</span></label>
        <input type="text" id="celular" name="celular" inputmode="numeric" maxlength="10" autocomplete="tel" class="solo-numeros">
        <div class="ayuda">Exactamente 10 números.</div>
        <div class="error" id="err-celular"></div>
      </div>

      <button type="submit" id="btnEnviar" disabled>Enviar</button>
      <div class="mensaje" id="mensaje"></div>
    </form>
    </div>
    <div class="pie">Mejor que el original</div>
  </div>

  <script>
    const form = document.getElementById('formulario');
    const btn = document.getElementById('btnEnviar');
    const msg = document.getElementById('mensaje');

    // Reglas de validación por campo: devuelven '' si es válido o el texto del error
    const reglas = {
      nombres: v => v.trim() ? '' : 'Ingrese los nombres.',
      apellidos: v => v.trim() ? '' : 'Ingrese los apellidos.',
      tipoDocumento: v => v === 'Cédula de ciudadanía' ? '' : 'Solo se admite cédula.',
      numeroDocumento: v => {
        if (!/^\d+$/.test(v)) return 'Solo se permiten números.';
        if (v.length < 5 || v.length > 10) return 'Debe tener entre 5 y 10 dígitos.';
        return '';
      },
      correo: v => {
        if (v.indexOf('@') === -1) return 'El correo debe contener @.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())) return 'Correo no válido (ej: nombre@dominio.com).';
        return '';
      },
      direccion: v => v.trim() ? '' : 'Ingrese la dirección.',
      billetera: v => (v === 'Nequi' || v === 'Daviplata') ? '' : 'Seleccione Nequi o Daviplata.',
      numeroBilletera: v => /^\d{10}$/.test(v) ? '' : 'Debe tener exactamente 10 números.',
      celular: v => /^\d{10}$/.test(v) ? '' : 'Debe tener exactamente 10 números.'
    };

    const tocados = new Set();

    // Bloquea cualquier carácter que no sea número (teclado y pegado)
    document.querySelectorAll('.solo-numeros').forEach(inp => {
      inp.addEventListener('input', () => {
        const limpio = inp.value.replace(/\D/g, '').slice(0, 10);
        if (inp.value !== limpio) inp.value = limpio;
      });
      inp.addEventListener('keypress', e => {
        if (!/[0-9]/.test(e.key)) e.preventDefault();
      });
    });

    function validarCampo(id, mostrar) {
      const el = document.getElementById(id);
      const error = reglas[id](el.value);
      if (mostrar) {
        document.getElementById('err-' + id).textContent = error;
        el.classList.toggle('invalido', !!error);
        el.classList.toggle('valido', !error);
      }
      return !error;
    }

    function validarTodo(mostrarTodos) {
      let ok = true;
      Object.keys(reglas).forEach(id => {
        const valido = validarCampo(id, mostrarTodos || tocados.has(id));
        if (!valido) ok = false;
      });
      btn.disabled = !ok;
      return ok;
    }

    Object.keys(reglas).forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => { tocados.add(id); validarTodo(false); });
      el.addEventListener('change', () => { tocados.add(id); validarTodo(false); });
      el.addEventListener('blur', () => { tocados.add(id); validarTodo(false); });
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      msg.className = 'mensaje';
      if (!validarTodo(true)) return;

      const datos = {};
      Object.keys(reglas).forEach(id => datos[id] = document.getElementById(id).value);

      btn.disabled = true;
      btn.textContent = 'Enviando…';
      enviar(datos, 1);
    });

    // ====== CONFIGURACIÓN: pega aquí la URL /exec de tu implementación de Apps Script ======
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbw250dhTvuJ8-Q8kUv1pchOElu_LOgucsYcYv2XZxB20V5IXwotbZQpgNP4GDf4HVQqrA/exec';

    // Envía al servidor; si el sistema está ocupado reintenta solo hasta 3 veces
    function enviar(datos, intento) {
      fetch(URL_SCRIPT, {
        method: 'POST',
        // text/plain evita la verificación CORS previa que Apps Script no soporta
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      })
        .then(r => r.json())
        .then(res => {
          if (!res.ok && res.codigo === 'OCUPADO' && intento < 3) {
            btn.textContent = 'Reintentando… (' + (intento + 1) + '/3)';
            setTimeout(() => enviar(datos, intento + 1), 2500);
            return;
          }
          btn.textContent = 'Enviar';
          msg.textContent = res.mensaje;
          if (res.ok) {
            msg.className = 'mensaje ok';
            form.reset();
            tocados.clear();
            document.querySelectorAll('.valido, .invalido').forEach(x => x.classList.remove('valido', 'invalido'));
            document.querySelectorAll('.error').forEach(x => x.textContent = '');
            btn.disabled = true;
          } else {
            msg.className = 'mensaje fallo';
            btn.disabled = false;
          }
          msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
        })
        .catch(err => {
          btn.textContent = 'Enviar';
          btn.disabled = false;
          msg.textContent = 'Error de conexión. Revisa tu internet e intenta de nuevo.';
          msg.className = 'mensaje fallo';
          console.error(err);
        });
    }
  </script>
</body>
</html>
